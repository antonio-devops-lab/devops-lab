apiVersion: v1
kind: Secret
metadata:
  name: postgres-test-credentials
type: Opaque
stringData:
  POSTGRES_PASSWORD: changeme-test-only
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-test
spec:
  serviceName: postgres-test
  replicas: 1
  selector:
    matchLabels:
      app: postgres-test
  template:
    metadata:
      labels:
        app: postgres-test
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-test-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-test
spec:
  type: ClusterIP
  selector:
    app: postgres-test
  ports:
    - port: 5432
      targetPort: 5432
