apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-lab-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:antonio-devops-lab/devops-lab.git
    targetRevision: main
    path: k8s/apps/devops-lab-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
